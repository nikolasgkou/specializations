<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Specialization branch — Zone01 Athens</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>" />

  <!-- Tailwind + Typography plugin for rendered markdown -->
  <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: {
        colors: { brand: { 50:'#eef2ff',100:'#e0e7ff',500:'#6366f1',600:'#4f46e5',700:'#4338ca' } },
        fontFamily: { sans: ['Inter','ui-sans-serif','system-ui','sans-serif'] },
      } },
    };
    if (localStorage.theme === 'dark' ||
       (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    }
  </script>
  <!-- Markdown renderer -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>

<body class="min-h-screen bg-white text-slate-800 antialiased dark:bg-slate-950 dark:text-slate-200">

  <header class="sticky top-0 z-10 border-b border-slate-200 bg-white/80 backdrop-blur dark:border-slate-800 dark:bg-slate-950/80">
    <div class="mx-auto flex max-w-3xl items-center justify-between px-4 py-4">
      <a href="./index.html" class="flex items-center gap-2 text-sm font-medium text-slate-600 hover:text-brand-600 dark:text-slate-400 dark:hover:text-brand-500">
        <span>←</span><span>All specializations</span>
      </a>
      <button id="theme-toggle" aria-label="Toggle dark mode"
        class="rounded-lg p-2 text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800">
        <svg class="hidden h-5 w-5 dark:block" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2m0 14v2m9-9h-2M5 12H3m15.36 6.36-1.42-1.42M7.06 7.06 5.64 5.64m12.72 0-1.42 1.42M7.06 16.94l-1.42 1.42M16 12a4 4 0 1 1-8 0 4 4 0 0 1 8 0Z"/></svg>
        <svg class="block h-5 w-5 dark:hidden" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>
      </button>
    </div>
  </header>

  <main class="mx-auto max-w-3xl px-4 py-12">
    <article id="content"
      class="prose prose-slate max-w-none dark:prose-invert
             prose-headings:scroll-mt-24 prose-a:text-brand-600 dark:prose-a:text-brand-500
             prose-table:text-sm prose-th:text-left">
      <p class="text-slate-500">Loading…</p>
    </article>
  </main>

  <footer class="border-t border-slate-200 dark:border-slate-800">
    <div class="mx-auto max-w-3xl px-4 py-10 text-sm text-slate-500">
      <a href="./index.html" class="text-brand-600 hover:underline dark:text-brand-500">← Back to all specializations</a>
    </div>
  </footer>

  <script>
    // Whitelist of valid documents — prevents arbitrary path access via the query string.
    const DOCS = new Set([
      '00-key-dates', 'artificial-intelligence', 'blockchain-crypto', 'cloud-devops',
      'combining-specializations', 'cybersecurity', 'java-fullstack',
      'mobile-applications', 'video-games',
    ]);

    const params = new URLSearchParams(location.search);
    const slug = params.get('b');
    const el = document.getElementById('content');

    async function render() {
      if (!slug || !DOCS.has(slug)) {
        el.innerHTML = '<h1>Branch not found</h1><p>Pick one from the <a href="./index.html">list of specializations</a>.</p>';
        return;
      }
      try {
        const res = await fetch(`./pitches/${slug}.md`);
        if (!res.ok) throw new Error(res.status);
        const md = await res.text();
        document.title = (md.match(/^#\s+(.+)$/m)?.[1] || 'Specialization') + ' — Zone01 Athens';
        el.innerHTML = marked.parse(md, { gfm: true });
        // External links open in a new tab so the pitch stays put.
        el.querySelectorAll('a[href^="http"]').forEach(a => {
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
        });
      } catch (e) {
        el.innerHTML = '<h1>Could not load this branch</h1><p>Please try again, or go back to the <a href="./index.html">list of specializations</a>.</p>';
      }
    }
    render();

    document.getElementById('theme-toggle').addEventListener('click', () => {
      const root = document.documentElement;
      root.classList.toggle('dark');
      localStorage.theme = root.classList.contains('dark') ? 'dark' : 'light';
    });
  </script>
</body>
</html>
